<div class="app-shell">
  <a class="skip-link" href="#app-content">{{ t.t('nav.skip') }}</a>
  <app-offline-indicator></app-offline-indicator>

  <header class="desktop-masthead">
    <a routerLink="/home" class="brand-lockup" aria-label="Gym Tracker, inicio"><span aria-hidden="true">GT</span><strong>Gym Tracker</strong></a>
    <nav aria-label="Navegación principal">
      <a routerLink="/home" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }">{{ t.t('home.title') }}</a>
      <a routerLink="/routines" routerLinkActive="active-nav-tab">{{ t.t('routines.title') }}</a>
      <a routerLink="/calendar" routerLinkActive="active-nav-tab">{{ t.t('calendar.title') }}</a>
      <a routerLink="/stats" routerLinkActive="active-nav-tab">{{ t.t('stats.title') }}</a>
    </nav>
    <a routerLink="/select-routine" class="desktop-train">{{ t.t('nav.train') }} <span aria-hidden="true">↗</span></a>
  </header>

  <main id="app-content"><router-outlet></router-outlet></main>

  <nav class="mobile-dock" aria-label="Navegación principal">
    <a routerLink="/home" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4Z"/><path d="M9 20v-6h6v6"/></svg><span>{{ t.t('home.title') }}</span></a>
    <a routerLink="/routines" routerLinkActive="active-nav-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>{{ t.t('routines.title') }}</span></a>
    <a routerLink="/select-routine" routerLinkActive="active-nav-tab" class="mobile-dock__train" [attr.aria-label]="t.t('nav.train')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg><span>{{ t.t('nav.train') }}</span></a>
    <a routerLink="/calendar" routerLinkActive="active-nav-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v14H5zM8 3v6m8-6v6M5 10h14"/></svg><span>{{ t.t('calendar.title') }}</span></a>
    <a routerLink="/stats" routerLinkActive="active-nav-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11m7 8V5m7 14V8"/></svg><span>{{ t.t('stats.title') }}</span></a>
  </nav>
</div>
