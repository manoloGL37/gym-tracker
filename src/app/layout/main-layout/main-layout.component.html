<div class="flex flex-col min-h-screen bg-white overflow-x-hidden">
  <app-offline-indicator></app-offline-indicator>
  <main class="flex-1 pb-20 overflow-x-hidden">
    <router-outlet></router-outlet>
  </main>
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-200 flex justify-around items-center z-10 shadow-2xl" style="height: calc(5rem + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
    <a routerLink="/home" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }" class="flex flex-col items-center justify-center flex-1 h-full transition-all py-2">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-xs font-medium">{{ t.t('home.title') }}</span>
    </a>
    <a routerLink="/routines" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }" class="flex flex-col items-center justify-center flex-1 h-full transition-all py-2">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      <span class="text-xs font-medium">{{ t.t('routines.title') }}</span>
    </a>
    <a routerLink="/calendar" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }" class="flex flex-col items-center justify-center flex-1 h-full transition-all py-2">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span class="text-xs font-medium">{{ t.t('calendar.title') }}</span>
    </a>
    <a routerLink="/stats" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }" class="flex flex-col items-center justify-center flex-1 h-full transition-all py-2">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-xs font-medium">{{ t.t('stats.title') }}</span>
    </a>
    <a routerLink="/weight" routerLinkActive="active-nav-tab" [routerLinkActiveOptions]="{ exact: true }" class="flex flex-col items-center justify-center flex-1 h-full transition-all py-2">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 15c0-2.21 1.79-4 4-4s4 1.79 4 4"/></svg>
      <span class="text-xs font-medium">{{ t.t('weight.title') }}</span>
    </a>
  </nav>
</div>
