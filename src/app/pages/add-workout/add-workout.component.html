<div class="flex flex-col min-h-screen bg-gray-50 pb-4">
  <!-- Header -->
  <div class="bg-gradient-to-br from-orange-500 to-orange-700 text-white px-4 pt-4 pb-6 shadow-lg">
    <h1 class="text-2xl font-bold mb-1">{{ t.t('addWorkout.title') }}</h1>
    <div class="text-orange-100 text-sm">{{ t.t('addWorkout.subtitle') }}</div>
  </div>

  <form (ngSubmit)="save()" class="flex-1 px-4 pt-4" autocomplete="off">
    <label class="block mb-2 font-bold text-gray-900">{{ t.t('addWorkout.date') }}</label>
    <input type="date" [(ngModel)]="date" name="date" [max]="today" class="w-full mb-4 px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" required />

    <label class="block mb-2 font-bold text-gray-900">{{ t.t('addWorkout.routine') }}</label>
    <select [(ngModel)]="selectedRoutineId" name="routine" (change)="onRoutineChange()" class="w-full mb-4 px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" required>
      <option value="" disabled selected>{{ t.t('addWorkout.selectRoutine') }}</option>
      <option *ngFor="let r of routines" [value]="r.id">{{ r.name }}</option>
    </select>

    <ng-container *ngIf="selectedRoutine">
      <div *ngFor="let ex of exercises; let i = index" class="mb-4 bg-white rounded-2xl shadow-md border border-gray-100 px-4 py-4">
        <div class="font-bold text-gray-900 mb-3">{{ ex.name }}</div>
        <div *ngFor="let set of ex.sets; let j = index" class="mb-4">
          <div class="text-gray-600 text-xs font-semibold mb-2">{{ t.t('training.set', { number: j + 1 }) }}</div>
          <div class="flex items-center gap-3">
            <div class="flex-1">
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">{{ t.t('training.reps') }}</label>
              <div class="relative">
                <input type="number" [(ngModel)]="ex.sets[j].reps" name="reps{{i}}-{{j}}" min="0" class="w-full px-3 py-3 pr-12 border-2 border-orange-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-center font-bold text-xl" placeholder="0" />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-400 uppercase pointer-events-none">reps</span>
              </div>
            </div>
            <div class="flex-1">
              <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2">{{ t.t('training.weight') }}</label>
              <div class="relative">
                <input type="number" [(ngModel)]="ex.sets[j].weight" name="weight{{i}}-{{j}}" min="0" class="w-full px-3 py-3 pr-10 border-2 border-orange-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 text-center font-bold text-xl" placeholder="0" />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-400 uppercase pointer-events-none">kg</span>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-gray-200">
          <label class="block text-xs font-semibold text-gray-600 mb-2">{{ t.t('training.observationPlaceholder') }}</label>
          <textarea [(ngModel)]="ex.observation" name="observation{{i}}" rows="3" class="w-full border-2 border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 bg-white" placeholder="{{ t.t('training.observationPlaceholder') }}"></textarea>
        </div>
      </div>
    </ng-container>

    <div class="flex gap-3 mt-6">
      <button type="submit" [disabled]="!selectedRoutineId || !date || saving" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white rounded-xl px-4 py-4 font-bold shadow-lg active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed">{{ t.t('addWorkout.save') }}</button>
      <button type="button" (click)="cancel()" class="flex-1 bg-white border-2 border-gray-300 text-gray-800 rounded-xl px-4 py-4 font-bold shadow-md active:scale-95 transition-transform">{{ t.t('addWorkout.cancel') }}</button>
    </div>
  </form>
</div>
