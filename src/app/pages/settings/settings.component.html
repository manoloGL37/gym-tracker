<div class="flex flex-col min-h-screen bg-gray-50 pb-20">
  <!-- Header -->
  <div class="bg-gradient-to-br from-orange-500 to-orange-700 text-white px-4 pt-6 pb-6 shadow-lg">
    <div class="flex items-center gap-3 mb-2">
      <button (click)="goBack()" class="p-2 hover:bg-white/20 rounded-lg transition-all" [attr.aria-label]="'Back'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="text-3xl font-black">{{ t.t('settings.title') }}</h1>
    </div>
  </div>

  <div class="px-4 pt-6 space-y-6">
    <!-- Language -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5">
      <label class="block text-sm font-bold uppercase tracking-wide text-gray-700 mb-3">{{ t.t('settings.language') }}</label>
      <div class="flex gap-2">
        <button (click)="setLang('en')" [class.bg-orange-600]="lang() === 'en'" [class.text-white]="lang() === 'en'" [class.bg-white]="lang() !== 'en'" [class.text-orange-600]="lang() !== 'en'" class="flex-1 px-4 py-3 rounded-lg font-semibold text-sm shadow transition-all border-2 border-orange-600 hover:shadow-lg">{{ t.t('settings.language.en') }}</button>
        <button (click)="setLang('es')" [class.bg-orange-600]="lang() === 'es'" [class.text-white]="lang() === 'es'" [class.bg-white]="lang() !== 'es'" [class.text-orange-600]="lang() !== 'es'" class="flex-1 px-4 py-3 rounded-lg font-semibold text-sm shadow transition-all border-2 border-orange-600 hover:shadow-lg">{{ t.t('settings.language.es') }}</button>
      </div>
    </div>

    <!-- Backup -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5">
      <label class="block text-sm font-bold uppercase tracking-wide text-gray-700 mb-3">{{ t.t('settings.backup') }}</label>
      <div class="flex gap-2 mb-2">
        <button (click)="exportBackup()" class="flex-1 px-4 py-3 rounded-lg font-semibold text-sm bg-blue-600 text-white shadow hover:bg-blue-700 transition-all">{{ t.t('settings.backup.export') }}</button>
        <label class="flex-1 px-4 py-3 rounded-lg font-semibold text-sm bg-gray-100 text-gray-800 shadow border border-gray-300 cursor-pointer hover:bg-gray-200 transition-all text-center">
          {{ t.t('settings.backup.import') }}
          <input type="file" accept="application/json" (change)="onImportFile($event)" class="hidden" />
        </label>
      </div>
      <div *ngIf="importError()" class="text-red-600 text-sm font-medium mt-2">{{ importError() }}</div>
      <div *ngIf="importConfirm()" class="bg-yellow-100 border-2 border-yellow-400 rounded-lg p-4 mt-3">
        <div class="mb-3 font-semibold text-gray-900">{{ t.t('settings.backup.confirmReplace') }}</div>
        <div class="flex gap-2">
          <button (click)="confirmImport()" class="flex-1 px-4 py-2 rounded-lg font-semibold text-sm bg-green-600 text-white hover:bg-green-700 transition-all">{{ t.t('settings.backup.yesReplace') }}</button>
          <button (click)="cancelImport()" class="flex-1 px-4 py-2 rounded-lg font-semibold text-sm bg-gray-300 text-gray-800 hover:bg-gray-400 transition-all">{{ t.t('settings.backup.cancel') }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
