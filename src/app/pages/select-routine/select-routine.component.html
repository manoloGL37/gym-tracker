<div class="flex flex-col min-h-screen bg-gray-50 pb-4">
  <!-- Header -->
  <div class="bg-gradient-to-br from-orange-500 to-orange-700 text-white px-4 pt-4 pb-6 shadow-lg">
    <h1 class="text-2xl font-bold mb-1">{{ t.t('selectRoutine.title') }}</h1>
    <div class="text-orange-100 text-sm">{{ t.t('selectRoutine.subtitle') }}</div>
  </div>

  <div class="flex-1 px-4 pt-4">
    @if (!loading && routines.length) {
      @for (routine of routines; track routine.id) {
        <button
          (click)="selectRoutine(routine)"
          class="w-full text-left bg-white rounded-2xl shadow-md border border-gray-100 mb-3 px-4 py-5 active:scale-95 focus:outline-none focus:ring-4 focus:ring-orange-300 transition-transform"
        >
          <div class="flex flex-col">
            <span class="text-lg font-bold text-gray-900 mb-1">{{ routine.name }}</span>
            <span class="text-gray-500 text-sm font-medium">{{ routine.exercises.length }} {{ t.t('routines.exercises') }}</span>
          </div>
        </button>
      }
    } @else {
      <div class="text-center text-gray-400 mt-10 font-medium">{{ t.t('selectRoutine.noRoutines') }}</div>
    }
  </div>
</div>
